{% extends "base.html" %}

{% block title %}{{ note.title }}{% endblock %}

{% block content %}
    <h1>{{ note.title }}</h1>

    <p><em>Note id {{ note.id }}, owner: {{ note.owner.username }}</em></p>

    <p>{{ note.body }}</p>

    {% if note.owner == user %}
        <form method="post" action="{% url 'note_delete' note.id %}">
            {% csrf_token %}
            <button type="submit">Delete this note</button>
        </form>
    {% endif %}

    <p><a href="{% url 'note_list' %}">Back to my notes</a></p>
{% endblock %}
