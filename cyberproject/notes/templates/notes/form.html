{% extends "base.html" %}

{% block title %}New note{% endblock %}

{% block content %}
    <h1>New note</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>
            <label for="title">Title</label><br>
            <input type="text" id="title" name="title" autofocus>
        </p>
        <p>
            <label for="body">Body</label><br>
            <textarea id="body" name="body" rows="6" cols="40"></textarea>
        </p>
        <button type="submit">Save</button>
    </form>

    <p><a href="{% url 'note_list' %}">Back to my notes</a></p>
{% endblock %}
