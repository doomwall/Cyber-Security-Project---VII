{% extends "base.html" %}

{% block title %}My notes{% endblock %}

{% block content %}
    <h1>My notes</h1>

    <ul>
        {% for note in notes %}
            <li>
                <a href="{% url 'note_detail' note.id %}">{{ note.title }}</a>
                (id {{ note.id }})
            </li>
        {% empty %}
            <li>You have no notes yet.</li>
        {% endfor %}
    </ul>

    <p><a href="{% url 'note_create' %}">Write a new note</a></p>
{% endblock %}
